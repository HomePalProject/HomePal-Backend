<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Reset Password - HomePal</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: #ffffff; border-radius: 8px; padding: 30px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .header { text-align: center; color: #ef4444; }
        .btn { display: inline-block; padding: 12px 24px; background-color: #ef4444; color: #ffffff !important; text-decoration: none; border-radius: 6px; font-weight: bold; margin-top: 20px; }
        .footer { margin-top: 30px; font-size: 12px; color: #6b7280; text-align: center; }
    </style>
</head>
<body>
    <div class="container">
        <h2 class="header">Reset Your HomePal Password</h2>
        <p>Hi {{Name}},</p>
        <p>We received a request to reset your password for your HomePal account. Click the button below to proceed:</p>
        <p style="text-align: center;">
            <a href="{{ResetLink}}" class="btn">Reset Password</a>
        </p>
        <p>If you did not request a password reset, please ignore this message or contact support.</p>
        <div class="footer">
            &copy; 2026 HomePal. All rights reserved.
        </div>
    </div>
</body>
</html>
