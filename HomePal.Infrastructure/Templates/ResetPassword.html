<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Reset Password - HomePal</title>
    <style>
        body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background-color: #FAF8F5; margin: 0; padding: 30px 15px; color: #2C3E35; }
        .container { max-width: 520px; margin: 0 auto; background: #ffffff; border-radius: 16px; padding: 32px; box-shadow: 0 4px 20px rgba(47, 102, 82, 0.06); text-align: center; }
        .brand { font-size: 22px; font-weight: 700; color: #2F6652; margin-bottom: 20px; }
        h2 { color: #1C3A2F; margin: 0 0 12px 0; font-size: 20px; }
        p { font-size: 15px; line-height: 1.5; color: #5A6B63; margin: 0 0 16px 0; }
        .btn { display: inline-block; padding: 12px 28px; background-color: #2F6652; color: #ffffff !important; text-decoration: none; border-radius: 24px; font-weight: 600; font-size: 15px; margin: 16px 0; }
        .footer { margin-top: 24px; font-size: 12px; color: #8A9B92; }
    </style>
</head>
<body>
    <div class="container">
        <div class="brand">HomePal</div>
        <h2>Reset Your Password</h2>
        <p>Hi {{Name}},</p>
        <p>We received a request to reset your password for your HomePal account. Click the button below to proceed:</p>
        <p><a href="{{ResetLink}}" class="btn">Reset Password</a></p>
        <p style="font-size: 13px; color: #8A9B92;">If you did not request a password reset, please ignore this message or contact support.</p>
        <div class="footer">&copy; 2026 HomePal. All rights reserved.</div>
    </div>
</body>
</html>
