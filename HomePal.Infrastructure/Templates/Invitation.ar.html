<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8" />
    <title>دعوة من منزل HomePal</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; text-align: right; }
        .container { max-width: 600px; margin: 0 auto; background: #ffffff; border-radius: 8px; padding: 30px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .header { text-align: center; color: #8b5cf6; }
        .btn { display: inline-block; padding: 12px 24px; background-color: #8b5cf6; color: #ffffff !important; text-decoration: none; border-radius: 6px; font-weight: bold; margin-top: 20px; }
        .footer { margin-top: 30px; font-size: 12px; color: #6b7280; text-align: center; }
    </style>
</head>
<body>
    <div class="container">
        <h2 class="header">دعوة للانضمام إلى منزل في HomePal</h2>
        <p>مرحباً،</p>
        <p>قام <strong>{{InviterName}}</strong> بدعوتك للانضمام إلى منزله في HomePal.</p>
        <p style="text-align: center;">
            <a href="{{InvitationLink}}" class="btn">قبول الدعوة</a>
        </p>
        <div class="footer">
            &copy; 2026 HomePal. جميع الحقوق محفوظة.
        </div>
    </div>
</body>
</html>
