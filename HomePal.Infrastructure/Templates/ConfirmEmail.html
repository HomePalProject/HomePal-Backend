<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Confirm Your Email - HomePal</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: #ffffff; border-radius: 8px; padding: 30px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .header { text-align: center; color: #3b82f6; }
        .btn { display: inline-block; padding: 12px 24px; background-color: #3b82f6; color: #ffffff !important; text-decoration: none; border-radius: 6px; font-weight: bold; margin-top: 20px; }
        .footer { margin-top: 30px; font-size: 12px; color: #6b7280; text-align: center; }
    </style>
</head>
<body>
    <div class="container">
        <h2 class="header">Welcome to HomePal!</h2>
        <p>Hi {{Name}},</p>
        <p>Thank you for registering with HomePal. Please confirm your email address by clicking the button below:</p>
        <p style="text-align: center;">
            <a href="{{ConfirmationLink}}" class="btn">Confirm Email Address</a>
        </p>
        <p>If you did not create a HomePal account, you can safely ignore this email.</p>
        <div class="footer">
            &copy; 2026 HomePal. All rights reserved.
        </div>
    </div>
</body>
</html>
