<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - HomePal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2F6652;
            --primary-dark: #1C3A2F;
            --bg-gradient: linear-gradient(135deg, #0F231B 0%, #1C3A2F 50%, #2F6652 100%);
            --card-bg: rgba(255, 255, 255, 0.96);
            --text: #111827;
            --text-muted: #4B5563;
            --border: #E5E7EB;
            --success: #10B981;
            --danger: #EF4444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: var(--text);
        }

        body.rtl { font-family: 'Cairo', system-ui, -apple-system, sans-serif; direction: rtl; }

        .lang-btn {
            position: absolute; top: 20px; right: 20px;
            background: rgba(255, 255, 255, 0.15); backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2); color: #fff;
            padding: 8px 16px; border-radius: 20px; cursor: pointer;
            font-weight: 600; font-size: 14px; transition: 0.2s;
        }
        body.rtl .lang-btn { right: auto; left: 20px; }
        .lang-btn:hover { background: rgba(255, 255, 255, 0.3); }

        .card {
            background: var(--card-bg); width: 100%; max-width: 440px;
            border-radius: 24px; padding: 36px 28px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3); backdrop-filter: blur(12px);
        }

        .brand-icon {
            width: 64px; height: 64px; background: #E8F5F1; border-radius: 18px;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 20px; color: var(--primary);
        }
        .brand-icon svg { width: 32px; height: 32px; fill: currentColor; }

        h1 { font-size: 22px; font-weight: 800; color: var(--primary-dark); text-align: center; margin-bottom: 6px; }
        .subtitle { font-size: 14px; color: var(--text-muted); text-align: center; margin-bottom: 24px; line-height: 1.5; }

        .form-group { margin-bottom: 18px; text-align: left; }
        body.rtl .form-group { text-align: right; }

        label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 6px; }

        .input-wrapper { position: relative; display: flex; align-items: center; }

        input {
            width: 100%; padding: 12px 40px 12px 14px; font-size: 15px;
            border: 2px solid var(--border); border-radius: 12px; outline: none;
            transition: 0.2s; font-family: inherit;
        }
        body.rtl input { padding: 12px 14px 12px 40px; }
        input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(47, 102, 82, 0.12); }

        .toggle-eye {
            position: absolute; right: 12px; cursor: pointer; color: #9CA3AF;
            user-select: none; font-size: 18px;
        }
        body.rtl .toggle-eye { right: auto; left: 12px; }
        .toggle-eye:hover { color: var(--primary); }

        .alert {
            padding: 12px 16px; border-radius: 12px; font-size: 14px; margin-bottom: 20px; display: none;
        }
        .alert.danger { background: #FDE8E8; color: var(--danger); border: 1px solid #FBD5D5; }
        .alert.success { background: #DEF7EC; color: var(--success); border: 1px solid #BCF0DA; }

        .btn {
            display: inline-flex; align-items: center; justify-content: center;
            width: 100%; padding: 12px 24px; background: var(--primary);
            color: #fff; font-weight: 700; font-size: 15px; border-radius: 12px;
            border: none; cursor: pointer; transition: 0.2s;
            box-shadow: 0 4px 12px rgba(47, 102, 82, 0.25);
        }
        .btn:hover { background: var(--primary-dark); transform: translateY(-1px); }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

        .footer { margin-top: 24px; font-size: 12px; color: #9CA3AF; text-align: center; }
    </style>
</head>
<body>
    <button class="lang-btn" id="langBtn" onclick="toggleLang()">العربية</button>

    <div class="card">
        <div class="brand-icon">
            <svg viewBox="0 0 24 24">
                <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 6c1.4 0 2.5 1.1 2.5 2.5S13.4 12 12 12s-2.5-1.1-2.5-2.5S10.6 7 12 7zm4 10H8v-1c0-1.33 2.67-2 4-2s4 .67 4 2v1z"/>
            </svg>
        </div>

        <h1 id="title">Reset Password</h1>
        <p class="subtitle" id="subtitle">Enter your new password below to update your account security.</p>

        <div class="alert danger" id="errBox"></div>
        <div class="alert success" id="sucBox"></div>

        <form id="resetForm" onsubmit="handleReset(event)">
            <div class="form-group">
                <label id="lblNewPass" for="newPassword">New Password</label>
                <div class="input-wrapper">
                    <input type="password" id="newPassword" required placeholder="••••••••" minlength="8">
                    <span class="toggle-eye" onclick="togglePass('newPassword', this)">👁</span>
                </div>
            </div>

            <div class="form-group">
                <label id="lblConfirmPass" for="confirmPassword">Confirm New Password</label>
                <div class="input-wrapper">
                    <input type="password" id="confirmPassword" required placeholder="••••••••" minlength="8">
                    <span class="toggle-eye" onclick="togglePass('confirmPassword', this)">👁</span>
                </div>
            </div>

            <button type="submit" class="btn" id="submitBtn">Update Password</button>
        </form>

        <div class="footer">&copy; 2026 HomePal. All rights reserved.</div>
    </div>

    <script>
        const initialParams = new URLSearchParams(window.location.search);
        const urlLang = initialParams.get('lang') || initialParams.get('culture');
        let isAr = urlLang ? urlLang.toLowerCase().startsWith('ar') : (navigator.language || '').toLowerCase().startsWith('ar');

        const text = {
            en: {
                lang: "العربية",
                title: "Reset Password",
                subtitle: "Enter your new password below to update your account security.",
                lblNewPass: "New Password",
                lblConfirmPass: "Confirm New Password",
                submitBtn: "Update Password",
                submitting: "Updating...",
                mismatch: "Passwords do not match.",
                missingParams: "Missing email or password reset token.",
                successMsg: "Your password has been reset successfully! You can now log in."
            },
            ar: {
                lang: "English",
                title: "إعادة ضبط كلمة المرور",
                subtitle: "أدخل كلمة المرور الجديدة أدناه لتحديث أمان حسابك.",
                lblNewPass: "كلمة المرور الجديدة",
                lblConfirmPass: "تأكيد كلمة المرور الجديدة",
                submitBtn: "تحديث كلمة المرور",
                submitting: "جاري التحديث...",
                mismatch: "كلمتا المرور غير متطابقتين.",
                missingParams: "البريد الإلكتروني أو رمز إعادة الضبط مفقود.",
                successMsg: "تمت إعادة ضبط كلمة المرور بنجاح! يمكنك الآن تسجيل الدخول."
            }
        };

        function toggleLang() {
            isAr = !isAr;
            render();
        }

        function render() {
            document.body.classList.toggle('rtl', isAr);
            document.getElementById('langBtn').innerText = isAr ? text.ar.lang : text.en.lang;

            const lang = isAr ? 'ar' : 'en';
            document.getElementById('title').innerText = text[lang].title;
            document.getElementById('subtitle').innerText = text[lang].subtitle;
            document.getElementById('lblNewPass').innerText = text[lang].lblNewPass;
            document.getElementById('lblConfirmPass').innerText = text[lang].lblConfirmPass;
            document.getElementById('submitBtn').innerText = text[lang].submitBtn;
        }

        function togglePass(id) {
            const inp = document.getElementById(id);
            inp.type = inp.type === 'password' ? 'text' : 'password';
        }

        async function handleReset(e) {
            e.preventDefault();

            const params = new URLSearchParams(window.location.search);
            const email = params.get('email');
            const token = params.get('token');

            const errBox = document.getElementById('errBox');
            const sucBox = document.getElementById('sucBox');
            const btn = document.getElementById('submitBtn');
            const lang = isAr ? 'ar' : 'en';

            errBox.style.display = 'none';
            sucBox.style.display = 'none';

            if (!email || !token) {
                errBox.innerText = text[lang].missingParams;
                errBox.style.display = 'block';
                return;
            }

            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (newPassword !== confirmPassword) {
                errBox.innerText = text[lang].mismatch;
                errBox.style.display = 'block';
                return;
            }

            btn.disabled = true;
            btn.innerText = text[lang].submitting;

            try {
                const res = await fetch('/api/auth/reset-password', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept-Language': isAr ? 'ar' : 'en'
                    },
                    body: JSON.stringify({
                        email: email,
                        token: token,
                        newPassword: newPassword,
                        confirmNewPassword: confirmPassword
                    })
                });

                const data = await res.json();

                if (res.ok && (data.success || data.succeeded)) {
                    document.getElementById('resetForm').style.display = 'none';
                    sucBox.innerText = text[lang].successMsg;
                    sucBox.style.display = 'block';
                } else {
                    errBox.innerText = data.message || (data.errors && data.errors[0] ? data.errors[0].message : 'Reset failed');
                    errBox.style.display = 'block';
                    btn.disabled = false;
                    btn.innerText = text[lang].submitBtn;
                }
            } catch (err) {
                errBox.innerText = err.message;
                errBox.style.display = 'block';
                btn.disabled = false;
                btn.innerText = text[lang].submitBtn;
            }
        }

        render();
    </script>
</body>
</html>
