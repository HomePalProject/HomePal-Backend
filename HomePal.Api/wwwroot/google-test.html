<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HomePal - Google Authentication Tester</title>
    <!-- Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #f0f2f5; color: #1a1a1a; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .card { background: #ffffff; width: 100%; max-width: 650px; border-radius: 12px; padding: 30px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); }
        h2 { margin-bottom: 8px; color: #2c3e50; }
        p.subtitle { color: #6c757d; font-size: 14px; margin-bottom: 24px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-size: 13px; font-weight: 600; color: #495057; margin-bottom: 6px; }
        input[type="text"] { width: 100%; padding: 10px 14px; border: 1px solid #ced4da; border-radius: 6px; font-size: 14px; transition: border-color 0.2s; }
        input[type="text"]:focus { outline: none; border-color: #3b82f6; }
        .btn-init { background-color: #3b82f6; color: white; border: none; padding: 10px 18px; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 14px; margin-bottom: 20px; }
        .btn-init:hover { background-color: #2563eb; }
        .google-btn-wrapper { margin-top: 15px; display: flex; justify-content: center; min-height: 50px; }
        .console-header { margin-top: 30px; font-size: 14px; font-weight: 600; color: #343a40; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
        pre.output { background: #1e1e1e; color: #4ec9b0; padding: 16px; border-radius: 8px; font-family: 'Consolas', 'Courier New', monospace; font-size: 13px; max-height: 250px; overflow-y: auto; white-space: pre-wrap; word-break: break-all; }
        .status-badge { font-size: 12px; padding: 4px 10px; border-radius: 12px; font-weight: 600; }
        .status-idle { background: #e9ecef; color: #495057; }
        .status-success { background: #d1e7dd; color: #0f5132; }
        .status-error { background: #f8d7da; color: #842029; }
    </style>
</head>
<body>

<div class="card">
    <h2>HomePal Google Auth Tester</h2>
    <p class="subtitle">Test Google Sign-In integration with HomePal Backend API</p>

    <div class="form-group">
        <label for="clientId">Google Client ID</label>
        <input type="text" id="clientId" placeholder="e.g. 1234567890-abc123def.apps.googleusercontent.com" value="">
    </div>

    <div class="form-group">
        <label for="apiUrl">HomePal API Base URL</label>
        <input type="text" id="apiUrl" value="">
    </div>

    <button class="btn-init" onclick="initializeGoogleSignIn()">Initialize Google Sign-In Button</button>

    <div class="google-btn-wrapper">
        <div id="g_id_onload"></div>
        <div id="googleBtnContainer"></div>
    </div>

    <div class="console-header">
        <span>Execution Log</span>
        <span id="statusBadge" class="status-badge status-idle">Ready</span>
    </div>
    <pre id="output" class="output">Waiting for user interaction...</pre>
</div>

<script>
    document.getElementById('apiUrl').value = window.location.origin.includes('http') ? window.location.origin : 'https://localhost:7198';

    function log(message) {
        const output = document.getElementById('output');
        const timestamp = new Date().toLocaleTimeString();
        output.innerText = `[${timestamp}] ${message}\n\n` + output.innerText;
    }

    function setStatus(text, statusClass) {
        const badge = document.getElementById('statusBadge');
        badge.innerText = text;
        badge.className = `status-badge ${statusClass}`;
    }

    function initializeGoogleSignIn() {
        const clientId = document.getElementById('clientId').value.trim();
        if (!clientId) {
            alert('Please enter your Google Client ID first!');
            return;
        }

        const container = document.getElementById('googleBtnContainer');
        container.innerHTML = '';

        try {
            google.accounts.id.initialize({
                client_id: clientId,
                callback: handleCredentialResponse
            });

            google.accounts.id.renderButton(
                container,
                { theme: "outline", size: "large", type: "standard", shape: "rectangular" }
            );

            log('Google Sign-In button initialized successfully.');
            setStatus('Button Ready', 'status-idle');
        } catch (err) {
            log('Error initializing Google SDK: ' + err.message);
            setStatus('Initialization Error', 'status-error');
        }
    }

    async function handleCredentialResponse(response) {
        const idToken = response.credential;
        log('Google ID Token received from Google:\n' + idToken);
        setStatus('Authenticating with API...', 'status-idle');

        const baseUrl = document.getElementById('apiUrl').value.trim();
        const endpoint = `${baseUrl}/api/auth/google`;

        log(`Sending POST request to ${endpoint}...`);

        try {
            const apiResponse = await fetch(endpoint, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ idToken: idToken })
            });

            const data = await apiResponse.json();

            if (apiResponse.ok && data.success) {
                log('HomePal API Authentication SUCCESS:\n' + JSON.stringify(data, null, 2));
                setStatus('Authenticated', 'status-success');
            } else {
                log('HomePal API Authentication FAILED:\n' + JSON.stringify(data, null, 2));
                setStatus('Auth Failed', 'status-error');
            }
        } catch (error) {
            log('Network Error connecting to HomePal API: ' + error.message);
            setStatus('Network Error', 'status-error');
        }
    }
</script>

</body>
</html>
